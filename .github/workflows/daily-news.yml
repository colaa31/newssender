name: Daily international news digest

on:
  schedule:
    # 07:00 and 19:00 Asia/Shanghai
    - cron: '0 23 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-world-news
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and email digest
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_EMAIL_AUTH_CODE: ${{ secrets.QQ_EMAIL_AUTH_CODE }}
          NEWS_LOOKBACK_HOURS: '14'
          MAX_TECH_ITEMS: '12'
          MAX_POLITICS_ITEMS: '8'
        run: python news_digest.py
